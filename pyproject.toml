[project]
name = "em-agent"
version = "0.1.0"
description = "Agente de atendimento (CLI) para o Empório da Música — protótipo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # boto3 >= 1.40 honors AWS_BEARER_TOKEN_BEDROCK (Bedrock API key)
    "boto3>=1.40.0",
    "python-dotenv>=1.0.1",
    "typer>=0.15.1",
    "rich>=13.9.4",
]

[project.scripts]
# The command the reviewer types. The import package is `emporio` too;
# the repo/directory is `em-agent`.
emporio = "emporio.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio"]

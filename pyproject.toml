[project]
name = "tom"
version = "0.1.0"
description = "Customer service agent (CLI) for Empório da Música, prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # boto3 >= 1.40 honors AWS_BEARER_TOKEN_BEDROCK (Bedrock API key)
    "boto3>=1.40.0",
    "python-dotenv>=1.0.1",
    "typer>=0.15.1",
    "rich>=13.9.4",
    "pandas>=3.1.0",
    "pydantic>=2.14.2",
    "langchain>=1.4.8",
    "langgraph>=1.2.19",
    "langchain-aws>=1.9.1",
    "pyyaml>=6.0.3",
    "pdfplumber>=0.11.10",
    "numpy>=2.4.6",
]

[project.scripts]
# The command the reviewer types, and the name of the assistant in the persona.
# The import package stays `emporio`: it is the store whose catalog and policies
# the code models, and Tom is who consults them.
tom = "emporio.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261030",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite imports `tests.conftest` for the pinned reference date, so the repo
# root has to be importable.
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
files = ["src/emporio", "tests", "scripts"]
# mypy runs here so that the `Final` annotations are actually enforced and the
# None-handling in the loader is checked, not to enable every strictness option.
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# boto3 and botocore ship no type information.
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import sorting, UP pyupgrade.
select = ["E", "W", "F", "I", "UP"]
